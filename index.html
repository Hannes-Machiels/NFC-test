<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFC testpagina</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #f1f5f9;
    }

    main {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 32px #1720331a;
    }

    .icon { font-size: 48px; }

    h1 { margin: 12px 0 8px; }

    p {
      color: #64748b;
      line-height: 1.5;
    }

    a {
      display: block;
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      color: white;
      background: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <div class="icon">📱</div>
    <h1>Het werkt!</h1>
    <p>Je hebt onze NFC-testpagina geopend.</p>
    <a href="mailto:test@example.com">Stuur ons een e-mail</a>
  </main>
</body>
</html>
